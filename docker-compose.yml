version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: delivery-app-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: delivery2024
      MYSQL_DATABASE: delivery_app
      MYSQL_USER: delivery_user
      MYSQL_PASSWORD: delivery_pass
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdelivery2024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
    driver: local
